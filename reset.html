<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password | Neon Legacies Enterprise Builder</title>
    <meta name="description" content="Choose a new password for your Neon Legacies Enterprise Builder account.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.6; }
        .top-header { background: #0f172a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; }
        .logo-icon { background: #fbbf24; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #0f172a; }
        .logo-text h1 { font-size: 1.4rem; letter-spacing: -0.5px; }
        .logo-text p { font-size: 0.7rem; color: #94a3b8; }
        .top-nav a { color: white; text-decoration: none; margin-left: 22px; }
        .top-nav a:hover { color: #fbbf24; }
        main { max-width: 560px; margin: 60px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 36px; box-shadow: 0 10px 30px rgba(15,23,42,0.08); }
        .card h2 { font-size: 1.5rem; color: #0f172a; margin-bottom: 8px; }
        .card p.lead { color: #475569; margin-bottom: 22px; font-size: 0.95rem; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #334155; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; }
        input:focus { outline: 2px solid #fbbf24; border-color: #fbbf24; }
        .btn { display: inline-block; background: #0f172a; color: white; padding: 12px 26px; border: none; border-radius: 999px; text-decoration: none; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        .btn:hover { background: #fbbf24; color: #0f172a; }
        .btn[disabled] { opacity: 0.6; cursor: default; }
        .message { margin-top: 14px; font-size: 0.9rem; }
        .fine { font-size: 0.8rem; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>
    <header class="top-header">
        <a class="logo-area" href="index.html">
            <div class="logo-icon">NL</div>
            <div class="logo-text">
                <h1>Neon Legacies Enterprise Builder</h1>
                <p>Building what lasts.</p>
            </div>
        </a>
        <nav class="top-nav">
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Choose a new password</h2>
            <p class="lead" id="resetIntro">Enter a new password for your account.</p>

            <form id="resetForm" data-no-lead="true">
                <div class="form-group">
                    <label for="resetEmail">Email address</label>
                    <input type="email" id="resetEmail" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="resetNewPassword">New password (8+ characters, letters and numbers)</label>
                    <input type="password" id="resetNewPassword" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="resetConfirmPassword">Confirm new password</label>
                    <input type="password" id="resetConfirmPassword" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn" id="resetSubmit">Set new password →</button>
                <div class="message" id="resetMessage"></div>
            </form>

            <p class="fine">
                The link in your email works once and expires after an hour. You can
                <a href="profile.html">request a new one</a> at any time.
            </p>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="auth.js"></script>
    <script src="reset.js"></script>
</body>
</html>
